name: 雪球热股榜每日抓取

on:
  schedule:
    - cron: "10 7 * * 1-5"   # 北京时间 15:10，周一至周五
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行抓取脚本
        env:
          XUEQIU_TOKEN: ${{ secrets.XUEQIU_TOKEN }}
        run: python xueqiu_scraper.py --debug
        # 确认字段名正确后改为：python xueqiu_scraper.py

      - name: Commit & Push CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xueqiu_data/
          git diff --cached --quiet && echo "无新数据，跳过 commit" || \
            git commit -m "data: 热股榜 $(date -u +%Y-%m-%d)" && git push
